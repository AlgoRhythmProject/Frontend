name: CI/CD Pipeline (Frontend)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  repository_dispatch:
    types: [backend_push]

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install dependencies
        run: npm ci
        working-directory: AlgoRhythm

      - name: Run ESLint
        run: npm run lint
        working-directory: AlgoRhythm
        continue-on-error: true

      - name: Run Prettier check
        run: npm run format:check
        working-directory: AlgoRhythm
        continue-on-error: true

      - name: Run Unit Tests with Coverage
        run: npm run test:coverage
        working-directory: AlgoRhythm
        env:
          CI: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: AlgoRhythm/coverage/

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: AlgoRhythm/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Build application (LightningCSS-compatible)
        run: npm run build
        working-directory: AlgoRhythm
        env:
          CI: true
          NODE_ENV: production

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: AlgoRhythm/dist/
          retention-days: 7

  e2e-tests:
    name: E2E & UI Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
      # Repo frontendu
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          path: AlgoRhythmProject/Frontend

      # Repo backendu
      - name: Checkout backend code
        uses: actions/checkout@v5
        with:
          repository: 'AlgoRhythmProject/Backend'
          path: AlgoRhythmProject/Backend
          ref: ${{ github.event.client_payload.ref || 'develop' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci
        working-directory: AlgoRhythmProject/Frontend/AlgoRhythm

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: AlgoRhythmProject/Frontend/AlgoRhythm

      - name: Run Playwright tests (UI)
        run: npx playwright test --project=UI --reporter=blob --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        working-directory: AlgoRhythmProject/Frontend/AlgoRhythm
        env:
          CI: true

      - name: Run Playwright tests (E2E)
        run: npx playwright test --project=E2E --reporter=blob --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        working-directory: AlgoRhythmProject/Frontend/AlgoRhythm
        env:
          CI: true
          TEST_MODE: E2E
          BACKEND_PATH: ${{ github.workspace }}/AlgoRhythmProject/Backend/AlgoRhythm

          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-blob-reports-${{ matrix.shardIndex }}
          path: AlgoRhythmProject/Frontend/AlgoRhythm/blob-report/
          retention-days: 1

  merge-reports:
    name: Merge Playwright Reports
    if: always()
    needs: [ e2e-tests ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci
        working-directory: AlgoRhythm

      - name: Download all blobs
        uses: actions/download-artifact@v4
        with:
          path: AlgoRhythm/all-blob-reports
          pattern: all-blob-reports-*
          merge-multiple: true

      - name: Merge into HTML Report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
        working-directory: AlgoRhythm

      - name: Upload Final HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: final-playwright-report
          path: AlgoRhythm/playwright-report/
          retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install dependencies
        run: npm ci
        working-directory: AlgoRhythm

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        working-directory: AlgoRhythm
        continue-on-error: true

      - name: Check outdated dependencies
        run: npm outdated || true
        working-directory: AlgoRhythm
