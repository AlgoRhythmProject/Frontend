name: Build and Push Docker Images
on:
  push:
    branches: [ "main" ]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build frontend image
      - name: Build backend
        run: docker build -t ${{ env.REGISTRY }}/algorhythmproject/backend/algorhythm-frontend:latest -f ./AlgoRhythm/Dockerfile ./AlgoRhythm

      # Push frontend image
      - name: Push backend
        run: docker push ${{ env.REGISTRY }}/algorhythmproject/frontend/algorhythm-frontend:latest

